name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # CPU-only build: golden reference + fp8 oracle tests, runs on free runners.
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CPU only)
        run: cmake -B build -DINFEROP_BUILD_CUDA=OFF -DINFEROP_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Compile matrix for every supported architecture. Kernels cannot execute on
  # runners without GPUs, but the CPU sections of each test still run (they
  # validate linking against the CUDA runtime).
  cuda-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: "12.6.3"
            ubuntu: "22.04"
            arches: "80;86;89"
          - cuda: "12.8.1"
            ubuntu: "24.04"
            arches: "90;100;120"
          - cuda: "13.0.0"
            ubuntu: "24.04"
            arches: "90;100;120"
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu${{ matrix.ubuntu }}
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ git
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DINFEROP_CUDA_ARCHES="${{ matrix.arches }}"
      - name: Build
        run: cmake --build build -j
      - name: CPU sections of tests (GPU sections auto-skip)
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-latest
    # non-blocking for now; flip to blocking once a full pass of
    # scripts/format.sh has been committed
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find include kernels reference tests bench \
            \( -name "*.h" -o -name "*.cu" -o -name "*.cuh" -o -name "*.cpp" \) \
            -print0 | xargs -0 clang-format --dry-run || \
            echo '::warning::formatting differences found; run scripts/format.sh'
